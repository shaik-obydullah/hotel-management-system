name: hotel

services:
  app:
    build: ./docker
    container_name: hotel_app
    restart: "no"
    working_dir: /var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=hotel
      - DB_USERNAME=hotel
      - DB_PASSWORD=hotel_secret
    volumes:
      - ./:/var/www/html
      - ./docker/php/zz-app.conf:/usr/local/etc/php-fpm.d/zz-app.conf:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: hotel_web
    restart: "no"
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: hotel_db
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: hotel
      MYSQL_USER: hotel
      MYSQL_PASSWORD: hotel_secret
      TZ: UTC
    volumes:
      - hotel_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hotel_phpmyadmin
    restart: "no"
    ports:
      - "8044:80"
      - "8045:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  hotel_db_data:
